; /etc/php/8.5/fpm/pool.d/cloudhub.conf — separate pool, no CS2 files involved
[cloudhub]
user = cloudhub
group = cloudhub
listen = /run/php/cloudhub.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 20s
pm.max_requests = 500
request_terminate_timeout = 35s
clear_env = yes
env[CLOUDHUB_CONFIG] = /etc/cloudhub/config.php
env[CLOUDHUB_STORAGE] = /var/lib/cloudhub
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/cloudhub/php-error.log
php_admin_value[session.save_path] = /var/lib/cloudhub/sessions
php_admin_value[session.gc_maxlifetime] = 2592000
php_admin_value[pdo_mysql.default_socket] = /run/mysqld/mysqld.sock
php_admin_flag[expose_php] = off
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 64K
