# /etc/nginx/sites-available/skins.cloudhub.autos
# Keep the existing Certbot certificate paths if they differ.
server {
    listen 80;
    listen [::]:80;
    server_name skins.cloudhub.autos;
    location ^~ /.well-known/acme-challenge/ { root /var/www/skins.cloudhub.autos; }
    location / { return 301 https://skins.cloudhub.autos$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skins.cloudhub.autos;
    root /var/www/skins.cloudhub.autos;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/skins.cloudhub.autos/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skins.cloudhub.autos/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com https://*.steamstatic.com https://*.steamusercontent.com https://cdn.cloudflare.steamstatic.com; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://steamcommunity.com" always;

    location = /api { return 301 /api/; }
    location = /api/ { rewrite ^ /api/index.php last; }
    # Stage 2 is blocked until a separately configured staging rollout.
    location = /api/ingest.php { return 404; }
    # Only these application entry points can execute PHP.
    location ~ ^/api/(cloudhub|index|session|site-config|getUserProfile|skins|knife|loadouts|login-steam)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/cloudhub.sock;
        fastcgi_read_timeout 30s;
    }
    location ~ ^/api/steamauth/(steamlogin|login|logout)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/cloudhub.sock;
        fastcgi_read_timeout 30s;
    }
    location /api/ { return 404; }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
    location = /index.html { expires -1; }
    location = /sw.js { expires -1; }
    location = /data/image-manifest.json { expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /catalog-images/ { try_files $uri =404; expires 7d; }
    location /data/ { try_files $uri =404; expires 5m; }
    # Replace with include /etc/nginx/snippets/cloudhub-3d.conf; only when BETA_3D is enabled.
    location /lielxd/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
