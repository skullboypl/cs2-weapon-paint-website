# OPTIONAL staging-only replacement for the disabled /api/ingest.php location.
# In http {} first define:
# limit_req_zone $binary_remote_addr zone=cloudhub_ingest:10m rate=5r/s;
# Include this snippet inside the HTTPS server {} only after creating the separate FPM pool.
location = /api/ingest.php {
    # Recommended: allow the CS2 host's actual outbound IP and deny all others.
    # allow <confirmed-CS2-egress-IP>;
    # deny all;
    limit_except POST { deny all; }
    limit_req zone=cloudhub_ingest burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/api/ingest.php;
    fastcgi_param HTTPS on;
    fastcgi_pass unix:/run/php/cloudhub-ingest.sock;
    fastcgi_read_timeout 30s;
}
