; OPTIONAL: separate OS identity and private config. Do not enable in automatic setup.
[cloudhub-ingest]
user = cloudhub-ingest
group = cloudhub-ingest
listen = /run/php/cloudhub-ingest.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 20s
pm.max_requests = 500
request_terminate_timeout = 35s
clear_env = yes
env[CLOUDHUB_CONFIG] = /etc/cloudhub/ingest.php
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /var/log/cloudhub-ingest/php-error.log
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 64K
php_admin_value[pdo_mysql.default_socket] = /run/mysqld/mysqld.sock
