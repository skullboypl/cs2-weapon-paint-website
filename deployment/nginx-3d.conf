# Optional: include inside the HTTPS server instead of the default /lielxd/ block.
    # Optional beta 3D has a fixed upstream, never a user-provided destination.
    location /lielxd/ {
        proxy_pass https://raw.githubusercontent.com/LielXD/CS2-WeaponPaints-Website/refs/heads/main/src/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
