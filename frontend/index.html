<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Weapon Paints</title>
    <meta
      name="description"
      content="Manage your CS2 WeaponPaints loadout - skins, stickers, StatTrak, nametags and keychains for T and CT."
    />
    <meta name="application-name" content="Weapon Paints" />
    <meta name="apple-mobile-web-app-title" content="Weapon Paints" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0c121c" />
    <meta name="msapplication-TileColor" content="#0c121c" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="color-scheme" content="dark" />

    <!-- Tab / taskbar logo (/icon.png is tracked in git; /icons/* after full release upload) -->
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-16.png" type="image/png" sizes="16x16" />
    <link rel="shortcut icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/images/Steam_icon_logo.svg" color="#66c0f4" />

    <!-- PWA manifest (app manifest) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / link preview card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Weapon Paints" />
    <meta property="og:title" content="Weapon Paints" />
    <meta
      property="og:description"
      content="CS2 loadout manager - skins, stickers, StatTrak and keychains."
    />
    <meta property="og:image" content="/icon.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Weapon Paints logo" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="uk_UA" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Weapon Paints" />
    <meta
      name="twitter:description"
      content="CS2 loadout manager - skins, stickers, StatTrak and keychains."
    />
    <meta name="twitter:image" content="/icon.png" />
    <meta name="twitter:image:alt" content="Weapon Paints logo" />

    <link rel="stylesheet" href="/custom_style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
